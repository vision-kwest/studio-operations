[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "studio-operations"
version = "0.1.0"
description = "AWS operations plane for the Studio Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[ec2]>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
studio = "studio_operations.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_operations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

